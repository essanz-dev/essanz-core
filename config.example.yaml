# Essanz — Beispiel-Konfiguration
#
# ALLE Werte in dieser Datei sind frei erfunden (siehe beispiel.portfolio, das dazu passt).
# Für die eigene Nutzung: diese Datei nach config.yaml kopieren und mit den eigenen Werten
# befüllen. config.yaml steht in .gitignore — sie wird nie versehentlich committet.
#
# Schema:
#   zinsbindungen:      ein Eintrag je Darlehenskonto (Schlüssel = exakter Kontoname aus PP)
#   objektstamm:        ein Eintrag je Objektnummer (aus dem Kontonamen "Immobilie N: ...")
#   verkehrswert_herleitung: optional, wenn ein Gutachten mehrere Objekte gemeinsam bewertet
#   steuer:             optional; ohne diesen Abschnitt bleiben die Steuerspalten leer
#   allgemein:          Wechselkurse, welche Objekte selbstgenutzt sind, Schwellwerte
#   konten:             optional; wie Konten, Depots und Objekte erkannt werden (siehe ganz unten)
#
# Erst prüfen, wie Essanz die eigene Datei einordnet:
#   python3 run_update.py <datei.portfolio> --diagnose --config config.yaml

